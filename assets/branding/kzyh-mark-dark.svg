<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 195" width="100%" height="100%" fill="none" role="img" aria-labelledby="kzDarkTitle kzDarkDesc">
  <title id="kzDarkTitle">Kyaw Zay Ya Hein — KZ Signature Mark</title>
  <desc id="kzDarkDesc">Angular KZ monogram crossed by an orbital ring with a cosmic star sparkle.</desc>
  <defs>
    <linearGradient id="kzTrueMetalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2D0FF"/>
      <stop offset="70%" stop-color="#A879FF"/>
      <stop offset="100%" stop-color="#7447C8"/>
    </linearGradient>
    <filter id="kzTrueStarGlowDark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 1. Left Vertical Stem + Top Bar + Diagonal of Z -->
  <path d="M 41.2 18.0 L 69.7 18.0 L 71.6 67.4 L 121.0 18.0 L 236.9 18.0 L 84.9 170.0 L 45.0 170.0 L 41.2 124.4 Z" fill="url(#kzTrueMetalDark)"/>
  <!-- 2. Lower Leg of K -->
  <path d="M 153.3 120.6 L 179.9 105.4 L 236.9 162.4 L 236.9 170.0 L 197.0 170.0 Z" fill="url(#kzTrueMetalDark)"/>
  <!-- 3. Terminal Accent Notch -->
  <path d="M 229.3 105.4 L 261.6 137.7 L 261.6 170.0 L 229.3 137.7 Z" fill="url(#kzTrueMetalDark)"/>
  <!-- 4. Snug Orbital Ring -->
  <ellipse cx="151.4" cy="105.4" rx="133.0" ry="53.2" transform="rotate(-24 151.4 105.4)"
    fill="none" stroke="#A879FF" stroke-width="4.2" opacity="0.95"/>
  <!-- 5. 4-Ray Celestial Star Flare -->
  <path d="M271.1 15.3 L275.6 26.8 L287.1 31.3 L275.6 35.8 L271.1 47.3 L266.6 35.8 L255.10000000000002 31.3 L266.6 26.8 Z"
    fill="#FFFFFF" filter="url(#kzTrueStarGlowDark)"/>
  <circle cx="271.1" cy="31.3" r="2.8" fill="#FFFFFF"/>
</svg>