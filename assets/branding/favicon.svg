<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="kzSparkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop class="stop-1" offset="0%" stop-color="#FFFFFF"/>
      <stop class="stop-2" offset="35%" stop-color="#F4ECFF"/>
      <stop class="stop-3" offset="70%" stop-color="#D0B3FF"/>
      <stop class="stop-4" offset="100%" stop-color="#A879FF"/>
    </linearGradient>
    <filter id="kzSparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .kz-orbit { stroke: #D0B3FF; }
    .kz-spark { fill: url(#kzSparkGrad); }
    .kz-core { fill: #FFFFFF; }
    @media (prefers-color-scheme: light) {
      .stop-1 { stop-color: #3B0764; }
      .stop-2 { stop-color: #581C87; }
      .stop-3 { stop-color: #7C3AED; }
      .stop-4 { stop-color: #9333EA; }
      .kz-orbit { stroke: #7C3AED; }
      .kz-core { fill: #3B0764; }
    }
  </style>
  <!-- Rotated Orbital Ring (Brand Signature) -->
  <ellipse class="kz-orbit" cx="16" cy="16" rx="14" ry="5.5" transform="rotate(-24 16 16)" stroke-width="2.5" fill="none" opacity="0.92"/>
  <!-- Primary 4-Ray Celestial Starflare -->
  <path class="kz-spark" d="M 16 2 Q 16 16 30 16 Q 16 16 16 30 Q 16 16 2 16 Q 16 16 16 2 Z" filter="url(#kzSparkGlow)"/>
  <!-- Radiant Core -->
  <circle class="kz-core" cx="16" cy="16" r="3.2"/>
</svg>