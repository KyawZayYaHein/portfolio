<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 310" width="100%" height="100%" fill="none" role="img" aria-label="Kyaw Zay Ya Hein Compact Emblem">
  <defs>
    <linearGradient id="kzCmpGrad_dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="28%" stop-color="#E2D0FF"/>
      <stop offset="65%" stop-color="#A879FF"/>
      <stop offset="100%" stop-color="#7447C8"/>
    </linearGradient>
    <filter id="kzCmpGlow_dark" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(-15, -15)">
    <!-- 1. Left Vertical Component -->
    <path d="M137 55 L187 55 L187 175 L137 225 Z" fill="url(#kzCmpGrad_dark)"/>
    <!-- 2. Central Ribbon / Diagonal -->
    <path d="M133 105 L330 105 L173.5 245 L260 245 L400 105 L330 105 L133 105 Z" fill="url(#kzCmpGrad_dark)"/>
    <!-- 3. Lower-Right Component -->
    <path d="M199 170.6 L279 250.6 L349 250.6 L249 150.6 Z" fill="url(#kzCmpGrad_dark)"/>
    <path d="M349 190.6 L349 250.6 L389 250.6 L389 230.6 Z" fill="url(#kzCmpGrad_dark)"/>
    <!-- 4. Reinforced Orbital Ellipse (Stays visible down to 48px) -->
    <ellipse cx="260" cy="155" rx="172" ry="63" transform="rotate(-24 260 155)"
      fill="none" stroke="#A879FF" stroke-width="5.2" opacity="0.95"/>
    <!-- 5. Crisp 4-Ray Star Flare -->
    <path d="M414 74 L419 87 L432 92 L419 97 L414 110 L409 97 L396 92 L409 87 Z"
      fill="#FFFFFF" filter="url(#kzCmpGlow_dark)"/>
    <circle cx="414" cy="92" r="3.2" fill="#FFFFFF"/>
  </g>
</svg>